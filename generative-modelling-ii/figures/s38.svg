<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" role="img" aria-label="Annotated sampling loop code; the right margin tracks data and control flow."><title>Annotated sampling loop code; the right margin tracks data and control flow.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><g font-family="Avenir Next, Segoe UI, sans-serif"><g font-family="SF Mono, Menlo, monospace" xml:space="preserve" style="white-space:pre"><g data-step="1"><text x="18" y="38" fill="#4A5160" font-size="17" font-weight="500" text-anchor="start">01</text><text x="66" y="38" fill="#14171F" font-size="20" font-weight="500" text-anchor="start">x = torch.randn(shape)</text></g><g data-step="1"><text x="18" y="69" fill="#4A5160" font-size="17" font-weight="500" text-anchor="start">02</text><text x="66" y="69" fill="#14171F" font-size="20" font-weight="500" text-anchor="start">for step in range(T, 0, -1):</text></g><g data-step="1"><text x="18" y="100" fill="#4A5160" font-size="17" font-weight="500" text-anchor="start">03</text><text x="66" y="100" fill="#14171F" font-size="20" font-weight="500" text-anchor="start">    t = torch.full((B,), step, dtype=torch.long)</text></g><g data-step="1"><text x="18" y="131" fill="#4A5160" font-size="17" font-weight="500" text-anchor="start">04</text><text x="66" y="131" fill="#14171F" font-size="20" font-weight="500" text-anchor="start">    eps_hat = model(x, t)</text></g><g data-step="1"><text x="18" y="162" fill="#4A5160" font-size="17" font-weight="500" text-anchor="start">05</text><text x="66" y="162" fill="#14171F" font-size="20" font-weight="500" text-anchor="start">    mean = (x - beta[step] * eps_hat</text></g><g data-step="1"><text x="18" y="193" fill="#4A5160" font-size="17" font-weight="500" text-anchor="start">06</text><text x="66" y="193" fill="#14171F" font-size="20" font-weight="500" text-anchor="start">            / (1-alpha_bar[step]).sqrt())</text></g><g data-step="1"><text x="18" y="224" fill="#4A5160" font-size="17" font-weight="500" text-anchor="start">07</text><text x="66" y="224" fill="#14171F" font-size="20" font-weight="500" text-anchor="start">    mean = mean / alpha[step].sqrt()</text></g><g data-step="2"><text x="18" y="255" fill="#4A5160" font-size="17" font-weight="500" text-anchor="start">08</text><text x="66" y="255" fill="#14171F" font-size="20" font-weight="500" text-anchor="start">    if step &gt; 1:</text></g><g data-step="2"><text x="18" y="286" fill="#4A5160" font-size="17" font-weight="500" text-anchor="start">09</text><text x="66" y="286" fill="#14171F" font-size="20" font-weight="500" text-anchor="start">        x = mean + posterior_var[step].sqrt() * randn()</text></g><g data-step="2"><text x="18" y="317" fill="#4A5160" font-size="17" font-weight="500" text-anchor="start">10</text><text x="66" y="317" fill="#14171F" font-size="20" font-weight="500" text-anchor="start">    else:</text></g><g data-step="2"><text x="18" y="348" fill="#4A5160" font-size="17" font-weight="500" text-anchor="start">11</text><text x="66" y="348" fill="#14171F" font-size="20" font-weight="500" text-anchor="start">        x = mean</text></g></g><g data-step="1"><rect x="840" y="12" width="260" height="75" rx="5" stroke="#9A5700" stroke-width="2" fill="#9A570010"/><text x="970.0" y="57.5" fill="#9A5700" font-size="27" font-weight="500" text-anchor="middle">Start from noise</text><path d="M970,94 L970,118" fill="none" stroke="#9A5700" stroke-width="2.5" marker-end="url(#tip)"/><rect x="840" y="130" width="260" height="75" rx="5" stroke="#0F766E" stroke-width="2" fill="#0F766E10"/><text x="970.0" y="175.5" fill="#0F766E" font-size="27" font-weight="500" text-anchor="middle">Predict → mean</text></g><g data-step="2"><path d="M970,215 L970,239" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#tip)"/><rect x="840" y="250" width="260" height="75" rx="5" stroke="#245EDB" stroke-width="2" fill="#245EDB10"/><text x="970.0" y="283.5" fill="#245EDB" font-size="27" font-weight="500" text-anchor="middle">Sample state</text><text x="970.0" y="316.5" fill="#4A5160" font-size="20" font-weight="500" text-anchor="middle">except t=1</text><path d="M1107,290 H1115 V108 H1107 L1107,165" fill="none" stroke="#793DB5" stroke-width="2.5" marker-end="url(#tip)"/><text x="970" y="376" fill="#793DB5" font-size="22" font-weight="500" text-anchor="middle">return state to model</text></g></g></svg>