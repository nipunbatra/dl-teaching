<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-label="Appendix 8: graphical support for the mathematical construction."><title>Appendix 8: graphical support for the mathematical construction.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><g font-family="Avenir Next, Segoe UI, sans-serif"><circle cx="90" cy="220" r="10" fill="#9A5700"/><text x="90" y="268" fill="#9A5700" font-size="24" font-weight="500" text-anchor="middle">xnoise</text><circle cx="1020" cy="60" r="10" fill="#245EDB"/><text x="1020" y="33" fill="#245EDB" font-size="24" font-weight="500" text-anchor="middle">xdata</text><path d="M90,220 L1020,60" fill="none" stroke="#4A5160" stroke-width="2"/><g data-step="1"><circle cx="462" cy="156" r="9" fill="#793DB5"/><text x="462" y="200" fill="#793DB5" font-size="25" font-weight="500" text-anchor="middle">xτ at τ=0.4</text></g><g data-step="2"><path d="M462,156 L690,117" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#tip)"/><text x="650" y="83" fill="#0F766E" font-size="27" font-weight="500" text-anchor="middle">u = xdata − xnoise</text></g><g data-step="3"><text x="800" y="267" fill="#4A5160" font-size="21" font-weight="500" text-anchor="middle">Learned field averages compatible pair velocities</text></g></g></svg>