<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 350" role="img" aria-label="Independent scaled noise terms combine by adding their variances."><title>Independent scaled noise terms combine by adding their variances.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><g font-family="Avenir Next, Segoe UI, sans-serif"><g data-step="1"><rect x="25" y="48" width="235" height="78" rx="5" stroke="#9A5700" stroke-width="2" fill="#9A570010"/><text x="142.5" y="95.0" fill="#9A5700" font-size="27" font-weight="500" text-anchor="middle">η₁ ~ N(0,1)</text><path d="M270,87 L365,87" fill="none" stroke="#9A5700" stroke-width="2.5" marker-end="url(#tip)"/><rect x="375" y="48" width="265" height="78" rx="5" stroke="#9A5700" stroke-width="2" fill="#9A570010"/><text x="507.5" y="83.0" fill="#9A5700" font-size="27" font-weight="500" text-anchor="middle">× √(α₂β₁)</text><text x="507.5" y="116.0" fill="#4A5160" font-size="20" font-weight="500" text-anchor="middle">variance α₂β₁</text><rect x="25" y="204" width="235" height="78" rx="5" stroke="#793DB5" stroke-width="2" fill="#793DB510"/><text x="142.5" y="251.0" fill="#793DB5" font-size="27" font-weight="500" text-anchor="middle">η₂ ~ N(0,1)</text><path d="M270,243 L365,243" fill="none" stroke="#793DB5" stroke-width="2.5" marker-end="url(#tip)"/><rect x="375" y="204" width="265" height="78" rx="5" stroke="#793DB5" stroke-width="2" fill="#793DB510"/><text x="507.5" y="239.0" fill="#793DB5" font-size="27" font-weight="500" text-anchor="middle">× √β₂</text><text x="507.5" y="272.0" fill="#4A5160" font-size="20" font-weight="500" text-anchor="middle">variance β₂</text></g><g data-step="2"><path d="M650,88 L760,163" fill="none" stroke="#9A5700" stroke-width="2.5" marker-end="url(#tip)"/><path d="M650,243 L760,186" fill="none" stroke="#793DB5" stroke-width="2.5" marker-end="ur