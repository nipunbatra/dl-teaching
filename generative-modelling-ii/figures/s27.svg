<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" role="img" aria-label="Annotated training update code; the right margin tracks data and control flow."><title>Annotated training update code; the right margin tracks data and control flow.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><g font-family="Avenir Next, Segoe UI, sans-serif"><g font-family="SF Mono, Menlo, monospace" xml:space="preserve" style="white-space:pre"><g data-step="1"><text x="18" y="38" fill="#4A5160" font-size="17" font-weight="500" text-anchor="start">01</text><text x="66" y="38" fill="#14171F" font-size="20" font-weight="500" text-anchor="start">t = torch.randint(1, T+1, (B,), device=x0.device)</text></g><g data-step="1"><text x="18" y="69" fill="#4A5160" font-size="17" font-weight="500" text-anchor="start">02</text><text x="66" y="69" fill="#14171F" font-size="20" font-weight="500" text-anchor="start">eps = torch.randn_like(x0)</text></g><g data-step="2"><text x="18" y="100" fill="#4A5160" font-size="17" font-weight="500" text-anchor="start">03</text><text x="66" y="100" fill="#14171F" font-size="20" font-weight="500" text-anchor="start">ab = alpha_bar[t].reshape(B, 1, 1, 1)</text></g><g data-step="3"><text x="18" y="131" fill="#4A5160" font-size="17" font-weight="500" text-anchor="start">04</text><text x="66" y="131" fill="#14171F" font-size="20" font-weight="500" text-anchor="start">xt = ab.sqrt()*x0 + (1-ab).sqrt()*eps</text></g><g data-step="4"><text x="18" y="162" fill="#4A5160" font-size="17" font-weight="500" text-anchor="start">05</text><text x="66" y="162" fill="#14171F" font-size="20" font-weight="500" text-anchor="start">eps_hat = model(xt, t)</text></g><g data-step="4"><text x="18" y="193" fill="#4A5160" font-size="17" font-weight="500" text-anchor="start">06</text><text x="66" y="193" fill="#14171F" font-size="20" font-weight="500" text-anchor="start">loss = F.mse_loss(eps_hat, eps)</text></g><g data-step="4"><text x="18" y="224" fill="#4A5160" font-size="17" font-weight="500" text-anchor="start">07</text><text x="66" y="224" fill="#14171F" font-size="20" font-weight="500" text-anchor="start">optimizer.zero_grad(set_to_none=True)</text></g><g data-step="4"><text x="18" y="255" fill="#4A5160" font-size="17" font-weight="500" text-anchor="start">08</text><text x="66" y="255" fill="#14171F" font-size="20" font-weight="500" text-anchor="start">loss.backward()</text></g><g data-step="4"><text x="18" y="286" fill="#4A5160" font-size="17" font-weight="500" text-anchor="start">09</text><text x="66" y="286" fill="#14171F" font-size="20" font-weight="500" text-anchor="start">optimizer.step()</text></g></g><g data-step="1"><rect x="840" y="12" width="260" height="75" rx="5" stroke="#9A5700" stroke-width="2" fill="#9A570010"/><text x="970.0" y="57.5" fill="#9A5700" font-size="27" font-weight="500" text-anchor="middle">Draw t and ε</text></g><g data-step="2"><path d="M970,95 L970,119" fill="none" stroke="#9A5700" stroke-width="2.5" marker-end="url(#tip)"/><rect x="840" y="130" width="260" height="75" rx="5" stroke="#245EDB" stroke-width="2" fill="#245EDB10"/><text x="970.0" y="175.5" fill="#245EDB" font-size="27" font-weight="500" text-anchor="middle">Build noisy batch</text></g><g data-step="3"><path d="M970,215 L970,239" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#tip)"/><rect x="840" y="250" width="260" height="75" rx="5" stroke="#0F766E" stroke-width="2" fill="#0F766E10"/><text x="970.0" y="295.5" fill="#0F766E" font-size="27" font-weight="500" text-anchor="middle">Predict noise</text></g><g data-step="4"><text x="970" y="374" fill="#BE123C" font-size="26" font-weight="500" text-anchor="middle">loss → update θ</text></g></g></svg>