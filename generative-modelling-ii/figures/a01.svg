<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-label="Appendix 1: graphical support for the mathematical construction."><title>Appendix 1: graphical support for the mathematical construction.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><g font-family="Avenir Next, Segoe UI, sans-serif"><rect x="25" y="40" width="270" height="180" rx="5" stroke="#9A5700" stroke-width="2" fill="#9A570010"/><text x="160" y="85" fill="#9A5700" font-size="34" font-weight="500" text-anchor="middle">aX</text><text x="160" y="133" fill="#9A5700" font-size="26" font-weight="500" text-anchor="middle">mean: a mₓ</text><text x="160" y="178" fill="#9A5700" font-size="26" font-weight="500" text-anchor="middle">variance: a²vₓ</text><text x="350" y="145" fill="#4A5160" font-size="40" font-weight="500" text-anchor="middle">+</text><g data-step="2"><rect x="410" y="40" width="270" height="180" rx="5" stroke="#793DB5" stroke-width="2" fill="#793DB510"/><text x="545" y="85" fill="#793DB5" font-size="34" font-weight="500" text-anchor="middle">bY</text><text x="545" y="133" fill="#793DB5" font-size="26" font-weight="500" text-anchor="middle">mean: b mᵧ</text><text x="545" y="178" fill="#793DB5" font-size="26" font-weight="500" text-anchor="middle">variance: b²vᵧ</text><path d="M700,130 L780,130" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#tip)"/><text x="950" y="107" fill="#0F766E" font-size="28" font-weight="500" text-anchor="middle">Gaussian sum</text><text x="950" y="157" fill="#0F766E" font-size="25" font-weight="500" text-anchor="middle">variances add</text></g></g></svg>