<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" role="img" aria-label="Actual recorded noisy input and predicted noise at t350, each with the same spatial shape."><title>Actual recorded noisy input and predicted noise at t350, each with the same spatial shape.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><g font-family="Avenir Next, Segoe UI, sans-serif"><g data-step="1"><image href="data:image/png;base64," x="25" y="70" width="180" height="180" preserveAspectRatio="xMidYMid meet"/><text x="115.0" y="279" fill="#245EDB" font-size="24" font-weight="500" text-anchor="middle">noisy image xₜ</text><path d="M225,158 L390,158" fill="none" stroke="#245EDB" stroke-width="2.5" marker-end="url(#tip)"/><rect x="405" y="113" width="275" height="90" rx="5" stroke="#0F766E" stroke-width="2" fill="#0F766E10"/><text x="542.5" y="154.0" fill="#0F766E" font-size="27" font-weight="500" text-anchor="middle">Dense predictor</text><text x="542.5" y="187.0" fill="#4A5160" font-size="20" font-weight="500" text-anchor="middle">one output per position</text><path d="M695,158 L850,158" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#tip)"/><image href="data:image/png;base64," x="880" y="70" width="180" height="180" preserveAspectRatio="xMidYMid meet"/><text x="970.0" y="279" fill="#9A5700" font-size="24" font-weight="500" text-anchor="middle">predicted noise ε̂</text></g><g data-step="2"><text x="560" y="35" fill="#245EDB" font-size="28" font-weight="500" text-anchor="middle">The spatial shape stays [B,1,28,28]</text><text x="560" y="307" fill="#4A5160" font-size="22" font-weight="500" text-anchor="middle">Recorded input and prediction from the same t=350 model call.</text></g></g></svg>