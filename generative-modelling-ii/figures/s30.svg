<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" role="img" aria-label="One latent path with forward and learned reverse arrows, grouped into the three bound contributions."><title>One latent path with forward and learned reverse arrows, grouped into the three bound contributions.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><g font-family="Avenir Next, Segoe UI, sans-serif"><text x="20" y="28" fill="#9A5700" font-size="22" font-weight="500" text-anchor="start">FIXED FORWARD PROCESS q</text><rect x="52" y="60" width="96" height="70" rx="5" stroke="#245EDB" stroke-width="2" fill="#245EDB10"/><text x="100" y="106" fill="#245EDB" font-size="32" font-weight="500" text-anchor="middle">x₀</text><path d="M158,81 L290,81" fill="none" stroke="#9A5700" stroke-width="2.5" marker-end="url(#tip)"/><rect x="302" y="60" width="96" height="70" rx="5" stroke="#245EDB" stroke-width="2" fill="#245EDB10"/><text x="350" y="106" fill="#245EDB" font-size="32" font-weight="500" text-anchor="middle">x₁</text><path d="M408,81 L540,81" fill="none" stroke="#9A5700" stroke-width="2.5" marker-end="url(#tip)"/><g data-step="2"><path d="M292,113 L160,113" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#tip)"/></g><rect x="552" y="60" width="96" height="70" rx="5" stroke="#245EDB" stroke-width="2" fill="#245EDB10"/><text x="600" y="106" fill="#245EDB" font-size="32" font-weight="500" text-anchor="middle">x₂</text><path d="M658,81 L790,81" fill="none" stroke="#9A5700" stroke-width="2.5" marker-end="url(#tip)"/><g data-step="2"><path d="M542,113 L410,113" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#tip)"/></g><rect x="802" y="60" width="96" height="70" rx="5" stroke="#245EDB" stroke-width="2" fill="#245EDB10"/><text x="850" y="106" fill="#245EDB" font-size="32" font-weight="500" text-anchor="middle">…</text><path d="M908,81 L980,81" fill="none" stroke="#9A5700" stroke-width="2.5" marker-end="url(#tip)"/><g data-step="2"><path d="M792,113 L660,113" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#tip)"/></g><rect x="992" y="60" width="96" height="70" rx="5" stroke="#245EDB" stroke-width="2" fill="#245EDB10"/><text x="1040" y="106" fill="#245EDB" font-size="32" font-weight="500" text-anchor="middle">xT</text><g data-step="2"><path d="M982,113 L910,113" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#tip)"/></g><g data-step="2"><text x="560" y="175" fill="#0F766E" font-size="22" font-weight="500" text-anchor="middle">LEARNED REVERSE PROCESS pθ</text></g><g data-step="3"><rect x="15" y="215" width="250" height="91" rx="5" stroke="#245EDB" stroke-width="2" fill="#245EDB10"/><text x="140.0" y="249" fill="#245EDB" font-size="25" font-weight="500" text-anchor="middle">Endpoint</text><text x="140.0" y="284" fill="#4A5160" font-size="16" font-weight="500" text-anchor="middle">reconstruct x₀</text></g><g data-step="3"><rect x="300" y="215" width="510" height="91" rx="5" stroke="#0F766E" stroke-width="2" fill="#0F766E10"/><text x="555.0" y="249" fill="#0F766E" font-size="25" font-weight="500" text-anchor="middle">Local reverse terms</text><text x="555.0" y="284" fill="#4A5160" font-size="18" font-weight="500" text-anchor="middle">compare q(xₜ₋₁ | xₜ,x₀) with pθ(xₜ₋₁ | xₜ)</text></g><g data-step="3"><rect x="845" y="215" width="260" height="91" rx="5" stroke="#9A5700" stroke-width="2" fill="#9A570010"/><text x="975.0" y="249" fill="#9A5700" font-size="25" font-weight="500" text-anchor="middle">Prior term</text><text x="975.0" y="284" fill="#4A5160" font-size="16" font-weight="500" text-anchor="middle">match q(xT | x₀) to p(xT)</text></g></g></svg>