<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-label="Appendix 5: graphical support for the mathematical construction."><title>Appendix 5: graphical support for the mathematical construction.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><g font-family="Avenir Next, Segoe UI, sans-serif"><path d="M240,205 L240,20" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#tip)"/><path d="M140,205 L520,205" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#tip)"/><text x="540" y="213" fill="#245EDB" font-size="26" font-weight="500" text-anchor="middle">x₀</text><text x="216" y="45" fill="#9A5700" font-size="26" font-weight="500" text-anchor="middle">ε</text><g data-step="1"><path d="M240,205 L480,85" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#tip)"/><text x="503" y="81" fill="#0F766E" font-size="27" font-weight="500" text-anchor="middle">xₜ</text><path d="M240,205 L156,37" fill="none" stroke="#793DB5" stroke-width="2.5" marker-end="url(#tip)"/><text x="127" y="34" fill="#793DB5" font-size="27" font-weight="500" text-anchor="middle">v</text></g><g data-step="2"><text x="830" y="80" fill="#0F766E" font-size="27" font-weight="500" text-anchor="middle">Forward: rotate (x₀, ε)</text><text x="830" y="132" fill="#4A5160" font-size="27" font-weight="500" text-anchor="middle">ᾱₜ + (1−ᾱₜ) = 1</text></g><g data-step="3"><text x="830" y="219" fill="#793DB5" font-size="24" font-weight="500" text-anchor="middle">Inverse: transpose the rotation</text></g></g></svg>