<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" role="img" aria-label="Worked forward coordinate: 0.8 times one plus 0.6 times negative 0.5 equals 0.5."><title>Worked forward coordinate: 0.8 times one plus 0.6 times negative 0.5 equals 0.5.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><g font-family="Avenir Next, Segoe UI, sans-serif"><g data-step="1"><text x="45" y="45" fill="#4A5160" font-size="22" font-weight="500" text-anchor="start">Illustrative coordinate</text><text x="210" y="106" fill="#245EDB" font-size="34" font-weight="500" text-anchor="middle">x₀ = 1</text><text x="210" y="246" fill="#9A5700" font-size="34" font-weight="500" text-anchor="middle">ε = −0.5</text></g><g data-step="2"><path d="M315,97 L425,97" fill="none" stroke="#245EDB" stroke-width="2.5" marker-end="url(#tip)"/><rect x="435" y="60" width="220" height="75" rx="5" stroke="#245EDB" stroke-width="2" fill="#245EDB10"/><text x="545.0" y="93.5" fill="#245EDB" font-size="27" font-weight="500" text-anchor="middle">× 0.8</text><text x="545.0" y="126.5" fill="#4A5160" font-size="20" font-weight="500" text-anchor="middle">signal scaling</text><path d="M315,237 L425,237" fill="none" stroke="#9A5700" stroke-width="2.5" marker-end="url(#tip)"/><rect x="435" y="200" width="220" height="75" rx="5" stroke="#9A5700" stroke-width="2" fill="#9A570010"/><text x="545.0" y="233.5" fill="#9A5700" font-size="27" font-weight="500" text-anchor="middle">× 0.6</text><text x="545.0" y="266.5" fill="#4A5160" font-size="20" font-weight="500" text-anchor="middle">noise scaling</text></g><g data-step="3"><path d="M665,97 L755,97" fill="none" stroke="#245EDB" stroke-width="2.5" marker-end="url(#tip)"/><text x="818" y="106" fill="#245EDB" font-size="34" font-weight="500" text-anchor="middle">0.8</text><path d="M665,237 L755,237" fill="none" stroke="#9A5700" stroke-width="2.5" marker-end="url(#tip)"/><text x="818" y="246" fill="#9A5700" font-size="34" font-weight="500" text-anchor="middle">−0.3</text><path d="M870,97 L935,160" fill="none" stroke="#245EDB" stroke-width="2.5" marker-end="url(#tip)"/><path d="M870,237 L935,178" fill="none" stroke="#9A5700" stroke-width="2.5" marker-end="url(#tip)"/></g><g data-step="4"><text x="1015" y="181" fill="#0F766E" font-size="44" font-weight="500" text-anchor="middle">0.5</text><text x="1015" y="245" fill="#0F766E" font-size="28" font-weight="500" text-anchor="middle">x₂</text></g></g></svg>