<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" role="img" aria-label="Two-step example: one-step alpha is 0.8; cumulative signal variance retention is 0.64."><title>Two-step example: one-step alpha is 0.8; cumulative signal variance retention is 0.64.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><g font-family="Avenir Next, Segoe UI, sans-serif"><text x="20" y="32" fill="#4A5160" font-size="23" font-weight="500" text-anchor="start">Signal variance retention</text><g data-step="1"><text x="185" y="94" fill="#4A5160" font-size="24" font-weight="500" text-anchor="end">Start</text><rect x="215" y="68" width="500" height="36" rx="5" stroke="#D9DDE5" stroke-width="2" fill="#F7F8FA"/><rect x="215" y="68" width="500" height="36" rx="5" stroke="#245EDB" stroke-width="2" fill="#245EDB20"/><text x="755" y="95" fill="#245EDB" font-size="26" font-weight="500" text-anchor="start">1</text></g><g data-step="1"><text x="185" y="164" fill="#4A5160" font-size="24" font-weight="500" text-anchor="end">After step 1</text><rect x="215" y="138" width="500" height="36" rx="5" stroke="#D9DDE5" stroke-width="2" fill="#F7F8FA"/><rect x="215" y="138" width="400" height="36" rx="5" stroke="#245EDB" stroke-width="2" fill="#245EDB20"/><text x="755" y="165" fill="#245EDB" font-size="26" font-weight="500" text-anchor="start">0.8</text></g><g data-step="2"><text x="185" y="234" fill="#4A5160" font-size="24" font-weight="500" text-anchor="end">After step 2</text><rect x="215" y="208" width="500" height="36" rx="5" stroke="#D9DDE5" stroke-width="2" fill="#F7F8FA"/><rect x="215" y="208" width="320" height="36" rx="5" stroke="#245EDB" stroke-width="2" fill="#245EDB20"/><text x="755" y="235" fill="#245EDB" font-size="26" font-weight="500" text-anchor="start">0.64</text></g><g data-step="2"><text x="950" y="142" fill="#0F766E"