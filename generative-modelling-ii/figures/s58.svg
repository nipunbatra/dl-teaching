<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" role="img" aria-label="Illustrative discrete generation fills three response slots one at a time while retaining the observed prompt."><title>Illustrative discrete generation fills three response slots one at a time while retaining the observed prompt.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><g font-family="Avenir Next, Segoe UI, sans-serif"><text x="20" y="27" fill="#793DB5" font-size="23" font-weight="500" text-anchor="start">Observed prompt</text><text x="285" y="27" fill="#9A5700" font-size="23" font-weight="500" text-anchor="start">Response slots</text><g data-step="1"><rect x="20" y="45" width="100" height="47" rx="5" stroke="#793DB5" stroke-width="2" fill="#793DB510"/><text x="70.0" y="76" fill="#793DB5" font-size="23" font-weight="500" text-anchor="middle">The</text><rect x="132" y="45" width="100" height="47" rx="5" stroke="#793DB5" stroke-width="2" fill="#793DB510"/><text x="182.0" y="76" fill="#793DB5" font-size="23" font-weight="500" text-anchor="middle">dog</text><rect x="244" y="45" width="100" height="47" rx="5" stroke="#9A5700" stroke-width="2" fill="#9A570010"/><text x="294.0" y="76" fill="#9A5700" font-size="23" font-weight="500" text-anchor="middle">?</text><rect x="356" y="45" width="100" height="47" rx="5" stroke="#9A5700" stroke-width="2" fill="#9A570010"/><text x="406.0" y="76" fill="#9A5700" font-size="23" font-weight="500" text-anchor="middle">?</text><rect x="468" y="45" width="100" height="47" rx="5" stroke="#9A5700" stroke-width="2" fill="#9A570010"/><text x="518.0" y="76" fill="#9A5700" font-size="23" font-weight="500" text-anchor="middle">?</text><path d="M630,70 L760,70" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#tip)"/><text x="930" y="78" fill="#0F766E" font-size="23" font-weight="500" text-anchor="middle">predict a missing token</text><rect x="20" y="118" width="100" height="47" rx="5" stroke="#793DB5" stroke-width="2" fill="#793DB510"/><text x="70.0" y="149" fill="#793DB5" font-size="23" font-weight="500" text-anchor="middle">The</text><rect x="132" y="118" width="100" height="47" rx="5" stroke="#793DB5" stroke-width="2" fill="#793DB510"/><text x="182.0" y="149" fill="#793DB5" font-size="23" font-weight="500" text-anchor="middle">dog</text><rect x="244" y="118" width="100" height="47" rx="5" stroke="#0F766E" stroke-width="2" fill="#0F766E10"/><text x="294.0" y="149" fill="#0F766E" font-size="23" font-weight="500" text-anchor="middle">chased</text><rect x="356" y="118" width="100" height="47" rx="5" stroke="#9A5700" stroke-width="2" fill="#9A570010"/><text x="406.0" y="149" fill="#9A5700" font-size="23" font-weight="500" text-anchor="middle">?</text><rect x="468" y="118" width="100" height="47" rx="5" stroke="#9A5700" stroke-width="2" fill="#9A570010"/><text x="518.0" y="149" fill="#9A5700" font-size="23" font-weight="500" text-anchor="middle">?</text><text x="790" y="149" fill="#793DB5" font-size="23" font-weight="500" text-anchor="middle">The prompt stays fixed</text></g><g data-step="2"><rect x="20" y="191" width="100" height="47" rx="5" stroke="#793DB5" stroke-width="2" fill="#793DB510"/><text x="70.0" y="222" fill="#793DB5" font-size="23" font-weight="500" text-anchor="middle">The</text><rect x="132" y="191" width="100" height="47" rx="5" stroke="#793DB5" stroke-width="2" fill="#793DB510"/><text x="182.0" y="222" fill="#793DB5" font-size="23" font-weight="500" text-anchor="middle">dog</text><rect x="244" y="191" width="100" height="47" rx="5" stroke="#0F766E" stroke-width="2" fill="#0F766E10"/><text x="294.0" y="222" fill="#0F766E" font-size="23" font-weight="500" text-anchor="middle">chased</text><rect x="356" y="191" width="100" height="47" rx="5" stroke="#0F766E" stroke-width="2" fill="#0F766E10"/><text x="406.0" y="222" fill="#0F766E" font-size="23" font-weight="500" text-anchor="middle">the</text><rect x="468" y="191" width="100" height="47" rx="5" stroke="#9A5700" stroke-width="2" fill="#9A570010"/><text x="518.0" y="222" fill="#9A5700" font-size="23" font-weight="500" text-anchor="middle">?</text><rect x="20" y="264" width="100" height="47" rx="5" stroke="#793DB5" stroke-width="2" fill="#793DB510"/><text x="70.0" y="295" fill="#793DB5" font-size="23" font-weight="500" text-anchor="middle">The</text><rect x="132" y="264" width="100" height="47" rx="5" stroke="#793DB5" stroke-width="2" fill="#793DB510"/><text x="182.0" y="295" fill="#793DB5" font-size="23" font-weight="500" text-anchor="middle">dog</text><rect x="244" y="264" width="100" height="47" rx="5" stroke="#0F766E" stroke-width="2" fill="#0F766E10"/><text x="294.0" y="295" fill="#0F766E" font-size="23" font-weight="500" text-anchor="middle">chased</text><rect x="356" y="264" width="100" height="47" rx="5" stroke="#0F766E" stroke-width="2" fill="#0F766E10"/><text x="406.0" y="295" fill="#0F766E" font-size="23" font-weight="500" text-anchor="middle">the</text><rect x="468" y="264" width="100" height="47" rx="5" stroke="#0F766E" stroke-width="2" fill="#0F766E10"/><text x="518.0" y="295" fill="#0F766E" font-size="23" font-weight="500" text-anchor="middle">ball</text><text x="817" y="256" fill="#0F766E" font-size="24" font-weight="500" text-anchor="middle">one slot per iteration</text><text x="817" y="290" fill="#4A5160" font-size="20" font-weight="500" text-anchor="middle">scripted, no remasking</text></g></g></svg>