<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" role="img" aria-label="Training branches: build the noisy input, predict its noise, and compare with the retained target. Gradients update the denoiser."><title>Training branches: build the noisy input, predict its noise, and compare with the retained target. Gradients update the denoiser.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><g font-family="Avenir Next, Segoe UI, sans-serif"><g data-step="1"><image href="data:image/png;base64," x="15" y="90" width="115" height="115" preserveAspectRatio="xMidYMid meet"/><text x="72.5" y="234" fill="#245EDB" font-size="24" font-weight="500" text-anchor="middle">clean x₀</text><path d="M143,148 L224,148" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#tip)"/><rect x="235" y="106" width="180" height="86" rx="5" stroke="#9A5700" stroke-width="2" fill="#9A570010"/><text x="325.0" y="145.0" fill="#9A5700" font-size="27" font-weight="500" text-anchor="middle">Add noise</text><text x="325.0" y="178.0" fill="#4A5160" font-size="20" font-weight="500" text-anchor="middle">known ε, chosen t</text><path d="M420,148 L480,148" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#tip)"/><image href="data:image/png;base64," x="490" y="90" width="115" height="115" preserveAspectRatio="xMidYMid meet"/><text x="547.5" y="234" fill="#245EDB" font-size="24" font-weight="500" text-anchor="middle">noisy xₜ</text><text x="325" y="70" fill="#9A5700" font-size="23" font-weight="500" text-anchor="middle">We make the target</text></g><g data-step="1"><path d="M620,148 L673,148" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#tip)"/><rect x="680" y="106" width="200" height="86" rx="5" stroke="#0F766E" stroke-width="2" fill="#0F766E10"/><text x="780.0" y="145.0" fill="#0F766E" font-size="27" font-weight="500" text-anchor="middle">Denoiser</text><text x="780.0" y="178.0" fill="#4A5160" font-size="20" font-weight="500" text-anchor="middle">εθ(xₜ, t)</text><text x="775" y="70" fill="#0F766E" font-size="21" font-weight="500" text-anchor="middle">trainable weights θ</text><path d="M888,148 L966,148" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#tip)"/><text x="1030" y="150" fill="#0F766E" font-size="43" font-weight="500" text-anchor="middle">ε̂</text><text x="1030" y="187" fill="#4A5160" font-size="20" font-weight="500" text-anchor="middle">prediction</text></g><g data-step="2"><path d="M325,200 V245 H960 L1000,245" fill="none" stroke="#9A5700" stroke-width="2.5" marker-end="url(#tip)"/><text x="605" y="277" fill="#9A5700" font-size="23" font-weight="500" text-anchor="middle">target branch: ε</text><rect x="970" y="218" width="130" height="70" rx="5" stroke="#BE123C" stroke-width="2" fill="#BE123C10"/><text x="1035.0" y="261.0" fill="#BE123C" font-size="27" font-weight="500" text-anchor="middle">MSE</text><path d="M1030,196 L1030,212" fill="none" stroke="#BE123C" stroke-width="2.5" marker-end="url(#tip)"/></g><g data-step="1"><path d="M1000,213 V30 H805 L805,93" fill="none" stroke="#BE123C" stroke-width="2.5" marker-end="url(#tip)"/><text x="900" y="22" fill="#BE123C" font-size="21" font-weight="500" text-anchor="middle">gradient → θ</text></g></g></svg>