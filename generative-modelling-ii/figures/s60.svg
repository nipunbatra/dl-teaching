<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" role="img" aria-label="A progressively completed comparison table across pixel, latent and token generation."><title>A progressively completed comparison table across pixel, latent and token generation.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><g font-family="Avenir Next, Segoe UI, sans-serif"><g data-step="1"><text x="125.0" y="37" fill="#245EDB" font-size="26" font-weight="500" text-anchor="middle">State</text></g><g data-step="2"><text x="395.0" y="37" fill="#793DB5" font-size="26" font-weight="500" text-anchor="middle">Condition</text></g><g data-step="3"><text x="680.0" y="37" fill="#9A5700" font-size="26" font-weight="500" text-anchor="middle">Training target</text></g><g data-step="4"><text x="970.0" y="37" fill="#0F766E" font-size="26" font-weight="500" text-anchor="middle">Sampling rule</text></g><g data-step="1"><rect x="10" y="85" width="220" height="67" rx="5" stroke="#245EDB" stroke-width="2" fill="#245EDB10"/><text x="120.0" y="126" fill="#245EDB" font-size="21" font-weight="500" text-anchor="middle">Pixels</text></g><g data-step="2"><rect x="250" y="85" width="280" height="67" rx="5" stroke="#793DB5" stroke-width="2" fill="#793DB510"/><text x="390.0" y="126" fill="#793DB5" font-size="21" font-weight="500" text-anchor="middle">partial image</text></g><g data-step="3"><rect x="550" y="85" width="250" height="67" rx="5" stroke="#9A5700" stroke-width="2" fill="#9A570010"/><text x="675.0" y="126" fill="#9A5700" font-size="21" font-weight="500" text-anchor="middle">known noise</text></g><g data-step="4"><rect x="820" y="85" width="290" height="67" rx="5" stroke="#0F766E" stroke-width="2" fill="#0F766E10"/><text x="965.0" y="126" fill="#0F766E" font-size="21" font-weight="500" text-anchor="middle">respect observed region</text></g><g data-step="1"><rect x="10" y="180" width="220" height="67" rx="5" stroke="#245EDB" stroke-width="2" fill="#245EDB10"/><text x="120.0" y="221" fill="#245EDB" font-size="21" font-weight="500" text-anchor="middle">Latents</text></g><g data-step="2"><rect x="250" y="180" width="280" height="67" rx="5" stroke="#793DB5" stroke-width="2" fill="#793DB510"/><text x="390.0" y="221" fill="#793DB5" font-size="21" font-weight="500" text-anchor="middle">prompt features</text></g><g data-step="3"><rect x="550" y="180" width="250" height="67" rx="5" stroke="#9A5700" stroke-width="2" fill="#9A570010"/><text x="675.0" y="221" fill="#9A5700" font-size="21" font-weight="500" text-anchor="middle">latent noise</text></g><g data-step="4"><rect x="820" y="180" width="290" height="67" rx="5" stroke="#0F766E" stroke-width="2" fill="#0F766E10"/><text x="965.0" y="221" fill="#0F766E" font-size="21" font-weight="500" text-anchor="middle">denoise, then decode</text></g><g data-step="1"><rect x="10" y="275" width="220" height="67" rx="5" stroke="#245EDB" stroke-width="2" fill="#245EDB10"/><text x="120.0" y="316" fill="#245EDB" font-size="21" font-weight="500" text-anchor="middle">Tokens</text></g><g data-step="2"><rect x="250" y="275" width="280" height="67" rx="5" stroke="#793DB5" stroke-width="2" fill="#793DB510"/><text x="390.0" y="316" fill="#793DB5" font-size="21" font-weight="500" text-anchor="middle">visible context</text></g><g data-step="3"><rect x="550" y="275" width="250" height="67" rx="5" stroke="#9A5700" stroke-width="2" fill="#9A570010"/><text x="675.0" y="316" fill="#9A5700" font-size="21" font-weight="500" text-anchor="middle">missing tokens</text></g><g data-step="4"><rect x="820" y="275" width="290" height="67" rx="5" stroke="#0F766E" stroke-width="2" fill="#0F766E10"/><text x="965.0" y="316" fill="#0F766E" font-size="21" font-weight="500" text-anchor="middle">fill response slots</text></g><text x="560" y="382" fill="#4A5160" font-size="18" font-weight="500" text-anchor="middle">A comparison of the teaching constructions; full systems can use other targets and samplers.</text></g></svg>