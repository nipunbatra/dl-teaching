<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" role="img" aria-label="Two training stages: train the autoencoder, then freeze it and train the latent denoiser."><title>Two training stages: train the autoencoder, then freeze it and train the latent denoiser.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><g font-family="Avenir Next, Segoe UI, sans-serif"><g data-step="1"><text x="25" y="32" fill="#245EDB" font-size="26" font-weight="500" text-anchor="start">1  Learn the representation</text><rect x="20" y="60" width="160" height="70" rx="5" stroke="#245EDB" stroke-width="2" fill="#245EDB10"/><text x="100.0" y="103.0" fill="#245EDB" font-size="27" font-weight="500" text-anchor="middle">Image</text><path d="M190,95 L230,95" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#tip)"/><rect x="240" y="60" width="170" height="70" rx="5" stroke="#0F766E" stroke-width="2" fill="#0F766E10"/><text x="325.0" y="103.0" fill="#0F766E" font-size="27" font-weight="500" text-anchor="middle">Encoder</text><path d="M420,95 L465,95" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#tip)"/><rect x="480" y="70" width="14" height="14" rx="2" fill="#793DB5" opacity="0.35"/><rect x="497" y="70" width="14" height="14" rx="2" fill="#793DB5" opacity="0.47"/><rect x="514" y="70" width="14" height="14" rx="2" fill="#793DB5" opacity="0.59"/><rect x="531" y="70" width="14" height="14" rx="2" fill="#793DB5" opacity="0.71"/><rect x="480" y="87" width="14" height="14" rx="2" fill="#793DB5" opacity="0.71"/><rect x="497" y="87" width="14" height="14" rx="2" fill="#793DB5" opacity="0.83"/><rect x="514" y="87" width="14" height="14" rx="2" fill="#793DB5" opacity="0.35"/><rect x="531" y="87" width="14" height="14" rx="2" fill="#793DB5" opacity="0.47"/><rect x="480" y="104" width="14" height="14" rx="2" fill="#793DB5" opacity="0.47"/><rect x="497" y="104" width="14" height="14" rx="2" fill="#793DB5" opacity="0.59"/><rect x="514" y="104" width="14" height="14" rx="2" fill="#793DB5" opacity="0.71"/><rect x="531" y="104" width="14" height="14" rx="2" fill="#793DB5" opacity="0.83"/><path d="M560,95 L615,95" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#tip)"/><rect x="625" y="60" width="170" height="70" rx="5" stroke="#0F766E" stroke-width="2" fill="#0F766E10"/><text x="710.0" y="103.0" fill="#0F766E" font-size="27" font-weight="500" text-anchor="middle">Decoder</text><path d="M805,95 L860,95" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#tip)"/><rect x="870" y="60" width="225" height="70" rx="5" stroke="#245EDB" stroke-width="2" fill="#245EDB10"/><text x="982.5" y="103.0" fill="#245EDB" font-size="27" font-weight="500" text-anchor="middle">Reconstruction</text><text x="555" y="160" fill="#245EDB" font-size="23" font-weight="500" text-anchor="middle">update encoder and decoder</text></g><g data-step="2"><text x="25" y="198" fill="#793DB5" font-size="26" font-weight="500" text-anchor="start">2  Learn to denoise latents</text><rect x="20" y="235" width="160" height="65" rx="5" stroke="#245EDB" stroke-width="2" fill="#245EDB10"/><text x="100.0" y="275.5" fill="#245EDB" font-size="27" font-weight="500" text-anchor="middle">Image</text><path d="M190,268 L230,268" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#tip)"/><rect x="240" y="235" width="170" height="65" rx="5" stroke="#4A5160" stroke-width="2" fill="#4A516010"/><text x="325.0" y="275.5" fill="#4A5160" font-size="27" font-weight="500" text-anchor="middle">Encoder</text><path d="M420,268 L465,268" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#tip)"/><rect x="475" y="235" width="220" height="65" rx="5" stroke="#9A5700" stroke-width="2" fill="#9A570010"/><text x="585.0" y="275.5" fill="#9A5700" font-size="27" font-weight="500" text-anchor="mid