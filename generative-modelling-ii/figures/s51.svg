<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" role="img" aria-label="Train the shared denoiser with the regular condition or a null condition; keep the noisy latent and target unchanged."><title>Train the shared denoiser with the regular condition or a null condition; keep the noisy latent and target unchanged.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><g font-family="Avenir Next, Segoe UI, sans-serif"><g data-step="1"><rect x="20" y="112" width="225" height="90" rx="5" stroke="#245EDB" stroke-width="2" fill="#245EDB10"/><text x="132.5" y="153.0" fill="#245EDB" font-size="27" font-weight="500" text-anchor="middle">Same noisy latent</text><text x="132.5" y="186.0" fill="#4A5160" font-size="20" font-weight="500" text-anchor="middle">inputs: zₜ and t</text><path d="M255,157 L350,157" fill="none" stroke="#245EDB" stroke-width="2.5" marker-end="url(#tip)"/><rect x="360" y="112" width="270" height="90" rx="5" stroke="#0F766E" stroke-width="2" fill="#0F766E10"/><text x="495.0" y="153.0" fill="#0F766E" font-size="27" font-weight="500" text-anchor="middle">One denoiser</text><text x="495.0" y="186.0" fill="#4A5160" font-size="20" font-weight="500" text-anchor="middle">shared parameters θ</text><path d="M642,157 L780,157" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#tip)"/><text x="950" y="168" fill="#0F766E" font-size="28" font-weight="500" text-anchor="middle">noise prediction</text></g><g data-step="1"><rect x="340" y="12" width="310" height="65" rx="5" stroke="#793DB5" stroke-width="2" fill="#793DB510"/><text x="495.0" y="52.5" fill="#793DB5" font-size="27" font-weight="500" text-anchor="middle">Text condition c</text><path d="M495,82 L495,104" fill="none" stroke="#793DB5" stroke-width="2.5" marker-end="url(#tip)"/></g><g data-step="2"><rect x="340" y="245" width="310" height="65" rx="5" stroke="#9A5700" stroke-width="2" fill="#9A570010"/><text x="495.0" y="285.5" fill="#9A5700" font-size="27" font-weight="500" text-anchor="middle">Null condition</text><path d="M495,236 L495,210" fill="none" stroke="#9A5700" stroke-width="2.5" marker-end="url(#tip)"/><text x="840" y="282" fill="#9A5700" font-size="25" font-weight="500" text-anchor="middle">sometimes drop c</text></g><g data-step="3"><text x="170" y="268" fill="#245EDB" font-size="20" font-weight="500" text-anchor="middle">input and target stay fixed</text></g></g></svg>