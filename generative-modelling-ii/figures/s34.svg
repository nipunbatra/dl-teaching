<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" role="img" aria-label="The noise prediction gives a clean estimate and a previous noisy state; only the previous state is fed back."><title>The noise prediction gives a clean estimate and a previous noisy state; only the previous state is fed back.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><g font-family="Avenir Next, Segoe UI, sans-serif"><image href="data:image/png;base64," x="50" y="85" width="135" height="135" preserveAspectRatio="xMidYMid meet"/><text x="117.5" y="249" fill="#245EDB" font-size="24" font-weight="500" text-anchor="middle">current xₜ</text><path d="M195,150 L320,150" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#tip)"/><rect x="330" y="106" width="200" height="88" rx="5" stroke="#0F766E" stroke-width="2" fill="#0F766E10"/><text x="430.0" y="146.0" fill="#0F766E" font-size="27" font-weight="500" text-anchor="middle">Predict noise</text><text x="430.0" y="179.0" fill="#4A5160" font-size="20" font-weight="500" text-anchor="middle">ε̂ = εθ(xₜ,t)</text><g data-step="1"><path d="M540,137 L678,75" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#tip)"/><rect x="690" y="32" width="370" height="80" rx="5" stroke="#0F766E" stroke-width="2" fill="#0F766E10"/><text x="875.0" y="68.0" fill="#0F766E" font-size="27" font-weight="500" text-anchor="middle">Clean estimate x̂₀</text><text x="875.0" y="101.0" fill="#4A5160" font-size="20" font-weight="500" text-anchor="middle">What might the original be?</text></g><g data-step="2"><path d="M540,165 L678,230" fill="none" stroke="#245EDB" stroke-width="2.5" marker-end="url(#tip)"/><rect x="690" y="190" width="370" height="80" rx="5" stroke="#245EDB" stroke-width="2" fill="#245EDB10"/><text x="875.0" y="226.0" fill="#245EDB" font-size="27" font-weight="500" text-anchor="middle">Sample previous state</text><text x="875.0" y="259.0" fill="#4A5160" font-size="20" font-weight="500" text-anchor="middle">Noise level matches t−1</text></g><g data-step="3"><path d="M880,280 V310 H388 L388,196" fill="none" stroke="#793DB5" stroke-width="2.5" marker-end="url(#tip)"/><text x="500" y="296" fill="#793DB5" font-size="22" font-weight="500" text-anchor="middle">Next model call</text></g></g></svg>