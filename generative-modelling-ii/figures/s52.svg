<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" role="img" aria-label="Classifier-free guidance vectors: unconditional at s zero, conditional at s one, extrapolated at s three."><title>Classifier-free guidance vectors: unconditional at s zero, conditional at s one, extrapolated at s three.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><g font-family="Avenir Next, Segoe UI, sans-serif"><path d="M155,260 L155,25" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#tip)"/><path d="M130,240 L1015,240" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#tip)"/><text x="155" y="286" fill="#4A5160" font-size="20" font-weight="500" text-anchor="middle">0</text><text x="1065" y="244" fill="#4A5160" font-size="23" font-weight="500" text-anchor="middle">ε[0]</text><text x="550" y="38" fill="#0F766E" font-size="28" font-weight="500" text-anchor="middle">εcfg = εu + s(εc − εu)</text><text x="103" y="35" fill="#4A5160" font-size="23" font-weight="500" text-anchor="middle">ε[1]</text><g data-step="1"><path d="M155,240 L261.0,294.0" fill="none" stroke="#9A5700" stroke-width="2.5" marker-end="url(#tip)"/><circle cx="261.0" cy="294.0" r="6" fill="#9A5700"/><text x="271.0" y="281.0" fill="#9A5700" font-size="24" font-weight="500" text-anchor="start">s=0: εu</text></g><g data-step="2"><path d="M155,240 L473.0,222.0" fill="none" stroke="#793DB5" stroke-width="2.5" marker-end="url(#tip)"/><circle cx="473.0" cy="222.0" r="6" fill="#793DB5"/><text x="483.0" y="209.0" fill="#793DB5" font-size="24" font-weight="500" text-anchor="start">s=1: εc</text></g><g data-step="3"><path d="M155,240 L897.0,78.0" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#tip)"/><circle cx="897.0" cy="78.0" r="6" fill="#0F766E"/><text x="907.0" y="65.0" fill="#0F766E" font-size="24" font-weight="500" text-anchor="start">s=3: extrapolate</text></g><g data-step="3"><path d="M261.0,294.0 L897.0,78.0" stroke="#793DB5" stroke-dasharray="7 6" fill="none" stroke-width="2"/></g><text x="600" y="314" fill="#4A5160" font-size="18" font-weight="500" text-anchor="middle">Illustrative vectors: εu = [.2, −.3], εc = [.6, .1]. Axes use different scales.</text></g></svg>