<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="380" height="200" font-family="EB Garamond, Georgia, serif">
<rect width="100%" height="100%" fill="#F7F3E9"/>
<circle cx="80" cy="50" r="22" fill="#F7F3E9" stroke="#1F1F1F" stroke-width="1.5"/>
<text x="80" y="56" text-anchor="middle" font-size="20" font-style="italic" fill="#1F1F1F">p</text>
<line x1="80" y1="73" x2="80" y2="120" stroke="#1F1F1F" stroke-width="1.5" marker-end="url(#arr)"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F1F1F"/></marker></defs>
<rect x="35" y="120" width="90" height="55" fill="none" stroke="#7B6E5A" stroke-width="1.2" rx="4"/>
<circle cx="80" cy="148" r="22" fill="#B85A3E" stroke="#1F1F1F" stroke-width="1.5"/>
<text x="80" y="155" text-anchor="middle" font-size="18" font-style="italic" fill="#F7F3E9">Y</text>
<text x="93" y="160" font-size="13" font-style="italic" fill="#F7F3E9">i</text>
<text x="118" y="170" font-size="13" fill="#7B6E5A">i = 1...N</text>
<text x="180" y="40" font-size="14" fill="#1F1F1F">Y_i ~ Bernoulli(p)</text>
<text x="180" y="62" font-size="13" fill="#7B6E5A">filled = observed</text>
<text x="180" y="80" font-size="13" fill="#7B6E5A">plate = repeat N times</text>
<text x="180" y="98" font-size="13" fill="#7B6E5A">all share the same p</text>
</svg>
