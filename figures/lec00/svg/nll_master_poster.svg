<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="EB Garamond, Georgia, serif">
  <defs>
    <style>
      .bg     { fill:#F7F3E9; }
      .title  { fill:#161513; font-size:46px; font-weight:700; }
      .sub    { fill:#5F5C54; font-size:21px; font-style:italic; }
      .eqn    { fill:#161513; font-size:30px; font-family:'JetBrains Mono', monospace; }
      .card   { fill:#FFFFFF; stroke:#E5D2C6; stroke-width:1.5; }
      .cardh  { font-size:23px; font-weight:700; }
      .dist   { fill:#5F5C54; font-size:16px; }
      .loss   { font-size:30px; font-weight:700; }
      .axis   { stroke:#C9C4B5; stroke-width:1.2; }
      .tag    { fill:#5F5C54; font-size:12px; letter-spacing:0.1em; }
      .chip   { fill:#F0EAD9; stroke:#E5D2C6; stroke-width:1; }
      .chiph  { fill:#161513; font-size:15px; font-weight:600; }
      .chipd  { fill:#5F5C54; font-size:12.5px; }
      .foot   { fill:#5F5C54; font-size:15px; font-style:italic; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="760"/>

  <!-- Title -->
  <text x="60" y="78" class="title">Every loss is a negative log-likelihood</text>
  <text x="62" y="112" class="sub">pick the distribution that matches your output — the loss falls out automatically</text>

  <!-- Master equation banner -->
  <rect x="60" y="138" width="1080" height="66" rx="12" fill="#37535F"/>
  <text x="600" y="181" text-anchor="middle" class="eqn" fill="#F7F3E9">loss(θ)  =  −  Σ  log  p( yᵢ | xᵢ , θ )</text>

  <!-- ===== Three primary cards ===== -->
  <!-- Card 1: Normal -> MSE -->
  <g transform="translate(60,236)">
    <rect class="card" width="345" height="250" rx="14"/>
    <rect width="345" height="8" rx="4" fill="#B85A3E"/>
    <text x="24" y="52" class="cardh" fill="#161513">Continuous y</text>
    <text x="24" y="80" class="dist">model a <tspan fill="#B85A3E" font-weight="700">Normal</tspan> · 𝒩(μ=θᵀx, σ²)</text>
    <!-- bell sketch -->
    <g transform="translate(24,96)">
      <line class="axis" x1="0" y1="92" x2="300" y2="92"/>
      <path d="M0,92 C 70,92 110,12 150,12 C 190,12 230,92 300,92" fill="none" stroke="#B85A3E" stroke-width="2.6"/>
    </g>
    <text x="24" y="232" class="loss" fill="#B85A3E">→  MSE</text>
  </g>

  <!-- Card 2: Bernoulli -> BCE -->
  <g transform="translate(427,236)">
    <rect class="card" width="345" height="250" rx="14"/>
    <rect width="345" height="8" rx="4" fill="#5F8573"/>
    <text x="24" y="52" class="cardh" fill="#161513">Binary y ∈ {0,1}</text>
    <text x="24" y="80" class="dist">model a <tspan fill="#5F8573" font-weight="700">Bernoulli</tspan> · p=σ(θᵀx)</text>
    <!-- two bars -->
    <g transform="translate(80,96)">
      <line class="axis" x1="-20" y1="92" x2="220" y2="92"/>
      <rect x="20"  y="22" width="58" height="70" fill="#5F8573"/>
      <rect x="120" y="58" width="58" height="34" fill="#9FB8AC"/>
      <text x="49"  y="110" text-anchor="middle" class="chipd">y=1</text>
      <text x="149" y="110" text-anchor="middle" class="chipd">y=0</text>
    </g>
    <text x="24" y="232" class="loss" fill="#5F8573">→  BCE</text>
  </g>

  <!-- Card 3: Categorical -> CE -->
  <g transform="translate(794,236)">
    <rect class="card" width="346" height="250" rx="14"/>
    <rect width="346" height="8" rx="4" fill="#37535F"/>
    <text x="24" y="52" class="cardh" fill="#161513">K classes</text>
    <text x="24" y="80" class="dist">model a <tspan fill="#37535F" font-weight="700">Categorical</tspan> · softmax(θᵀx)</text>
    <!-- multi bars -->
    <g transform="translate(40,96)">
      <line class="axis" x1="-10" y1="92" x2="280" y2="92"/>
      <rect x="10"  y="64" width="36" height="28" fill="#C9D3CE"/>
      <rect x="66"  y="30" width="36" height="62" fill="#37535F"/>
      <rect x="122" y="74" width="36" height="18" fill="#C9D3CE"/>
      <rect x="178" y="52" width="36" height="40" fill="#C9D3CE"/>
      <rect x="234" y="80" width="36" height="12" fill="#C9D3CE"/>
    </g>
    <text x="24" y="232" class="loss" fill="#37535F">→  Cross-entropy</text>
  </g>

  <!-- ===== Advanced strip ===== -->
  <text x="60" y="548" class="tag">THE SAME RECIPE, EVERY ADVANCED MODEL</text>
  <g transform="translate(60,562)">
    <!-- chip template -->
    <g>
      <rect class="chip" width="256" height="78" rx="10"/>
      <text x="18" y="32" class="chiph">VAE · L19</text>
      <text x="18" y="58" class="chipd">reconstruction NLL  +  KL prior</text>
    </g>
    <g transform="translate(274,0)">
      <rect class="chip" width="256" height="78" rx="10"/>
      <text x="18" y="32" class="chiph">Diffusion · L21</text>
      <text x="18" y="58" class="chipd">MSE on the predicted noise</text>
    </g>
    <g transform="translate(548,0)">
      <rect class="chip" width="256" height="78" rx="10"/>
      <text x="18" y="32" class="chiph">LLM · L13–L15</text>
      <text x="18" y="58" class="chipd">next-token cross-entropy</text>
    </g>
    <g transform="translate(822,0)">
      <rect class="chip" width="258" height="78" rx="10"/>
      <text x="18" y="32" class="chiph">DPO · Distill · L16/L23</text>
      <text x="18" y="58" class="chipd">KL to a reference distribution</text>
    </g>
  </g>

  <text x="600" y="712" text-anchor="middle" class="foot">stop memorizing losses — choose a distribution, take −log, and sum.</text>
</svg>
