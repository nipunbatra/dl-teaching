project:
  type: website
  output-dir: .
  render:
    - "*.qmd"
    - "labs/*.qmd"
    - "labs/*.ipynb"
    - "notebooks/*.ipynb"
    - "!slides/"

website:
  title: "ES 667: Deep Learning"
  navbar:
    title: "ES 667"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Syllabus"
        href: syllabus.qmd
      - text: "Slides"
        href: slides.qmd
      - text: "Notebooks"
        href: notebooks.qmd
      - text: "Labs"
        href: labs/index.qmd
      - text: "Resources"
        href: resources.qmd
      - text: "Interactives"
        href: https://nipunbatra.github.io/interactive-articles/
  page-footer:
    left: "Course materials by Prof. Nipun Batra, IIT Gandhinagar"
    right:
      - icon: github
        href: https://github.com/nipunbatra/dl-teaching

format:
  html:
    # Single light theme only — the dark (darkly) theme rendered notebook
    # output (plots, code cells) poorly, so we pin light mode site-wide.
    theme: [cosmo, custom.scss]
    toc: false
