project:
  type: website
  # Publish only Quarto's deliberately built site. The repository also contains
  # slide sources, archived decks, review material, and notebook source files;
  # none of those should become accidental public pages.
  output-dir: _site
  render:
    - "*.qmd"
    - "labs/*.qmd"
    - "notebooks/L01/00_likelihood_iid_worked_examples.ipynb"
    - "notebooks/L01/03_robust_linear_regression.ipynb"
    - "notebooks/L03/00_backprop_autograd_complete.ipynb"
    - "notebooks/L03/04_scalar_autograd_pytorch_to_scratch.ipynb"
  resources:
    - "slides-pdf/**"
    - "notebooks/**/*.ipynb"
    - "interactives/**"

website:
  title: "ES 667: Deep Learning"
  favicon: favicon.svg
  navbar:
    title: "ES 667"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Course guide"
        href: syllabus.qmd
      - text: "Lectures"
        href: slides.qmd
      - text: "Work"
        menu:
          - text: "Notebooks"
            href: notebooks.qmd
          - text: "Assignments"
            href: labs/index.qmd
      - text: "Resources"
        href: resources.qmd
  page-footer:
    left: "Course materials by Prof. Nipun Batra, IIT Gandhinagar"
    right:
      - icon: github
        href: https://github.com/nipunbatra/dl-teaching

format:
  html:
    # Single light theme only — the dark (darkly) theme rendered notebook
    # output (plots, code cells) poorly, so we pin light mode site-wide.
    theme: [cosmo, custom.scss]
    toc: false
